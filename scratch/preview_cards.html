<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop by Gender - Image Selection Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
  :root {
    --mg-gold-1: #D4AF37;
    --mg-gold-2: #C5A059;
    --mg-gold-3: #B38F46;
    --mg-gold-4: #8C6D23;
    --mg-gold-champagne: #F5E6C8;
    --mg-ink: #1c1917;
    --mg-ivory: #faf8f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fdfbf7;
    font-family: 'Poppins', sans-serif;
    color: var(--mg-ink);
    padding: 30px 20px;
  }
  .container {
    max-width: 1040px;
    margin: 0 auto;
  }
  .header-block {
    text-align: center;
    margin-bottom: 25px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--mg-gold-4);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .section-subtitle {
    font-size: 14px;
    color: #555;
    margin-bottom: 12px;
  }
  .flourish-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    max-width: 320px;
    margin: 0 auto;
  }
  .flourish-line {
    flex: 1;
    height: 1px;
    background: var(--mg-gold-2);
  }
  .flourish-icon {
    display: inline-block;
    color: var(--mg-gold-2);
  }

  .grid-preview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 20px;
  }
  .gender-card {
    background: #ffffff;
    border: 1px solid rgba(197, 160, 89, 0.35);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
  }
  .card-img-wrap {
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #f4ede2;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #ffffff;
    border-top: 1px solid rgba(197, 160, 89, 0.2);
  }
  .card-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--mg-gold-4);
    letter-spacing: 0.3px;
  }
  .card-explore {
    font-size: 13px;
    font-weight: 500;
    color: var(--mg-ink);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .card-explore i {
    font-size: 11px;
    transition: transform 0.2s;
  }
  .card-meta {
    font-size: 11px;
    color: #777;
    padding: 6px 14px 10px;
    background: #ffffff;
    border-top: 1px dashed #eee;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-block">
    <h2 class="section-title">Shop by Gender</h2>
    <p class="section-subtitle">First-class jewellery for first-class Men, Women &amp; Children.</p>
    <div class="flourish-divider">
      <span class="flourish-line"></span>
      <span class="flourish-icon">
        <svg width="38" height="14" viewBox="0 0 38 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 7C14 7 11 1 5 1C2 1 0 3.5 0 7C0 10.5 2 13 5 13C11 13 14 7 19 7Z" stroke="currentColor" stroke-width="1.2"/>
          <path d="M19 7C24 7 27 1 33 1C36 1 38 3.5 38 7C38 10.5 36 13 33 13C27 13 24 7 19 7Z" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="19" cy="7" r="2" fill="currentColor"/>
        </svg>
      </span>
      <span class="flourish-line"></span>
    </div>
  </div>

  <div class="grid-preview">
    <!-- Card 1: Men -->
    <div class="gender-card">
      <div class="card-img-wrap">
        <img src="../assets/ecomm/images/unsplash/gender_men.jpg" alt="Men's Jewellery">
      </div>
      <div class="card-footer">
        <span class="card-label">Men</span>
        <span class="card-explore">Explore <i class="fas fa-chevron-right"></i></span>
      </div>
      <div class="card-meta">
        <strong>Source:</strong> 22K Gold Curb Chain (51.1 KB, 800×1000)
      </div>
    </div>

    <!-- Card 2: Kids -->
    <div class="gender-card">
      <div class="card-img-wrap">
        <img src="../assets/ecomm/images/unsplash/gender_kids.jpg" alt="Kids' Jewellery">
      </div>
      <div class="card-footer">
        <span class="card-label">Kids</span>
        <span class="card-explore">Explore <i class="fas fa-chevron-right"></i></span>
      </div>
      <div class="card-meta">
        <strong>Source:</strong> Dainty Heart Gold Earrings (82.3 KB, 800×1000)
      </div>
    </div>

    <!-- Card 3: Women -->
    <div class="gender-card">
      <div class="card-img-wrap">
        <img src="../assets/ecomm/images/unsplash/gender_women.jpg" alt="Women's Jewellery">
      </div>
      <div class="card-footer">
        <span class="card-label">Women</span>
        <span class="card-explore">Explore <i class="fas fa-chevron-right"></i></span>
      </div>
      <div class="card-meta">
        <strong>Source:</strong> 22K Gold Necklace Set on Bust (87.9 KB, 800×1000)
      </div>
    </div>
  </div>
</div>
</body>
</html>
